name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
